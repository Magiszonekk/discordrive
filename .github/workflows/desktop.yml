name: Desktop app (Electron)

# Builds the desktop app and tests it on Linux and Windows: the agent's unit/integration tests, a smoke test
# (start page, built-in instance, window <-> agent, no Node in the page, outside navigation blocked, agent
# alive with the window closed) and an end-to-end run in the real app driven by Playwright. The Chromium
# sandbox stays on (no --no-sandbox).
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web-mo/**"
      - "packages/metadata-client/**"
      - "packages/sync-core/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: "Linux: display, and user namespaces for the Chromium sandbox"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; the sandbox needs them
          # (an installed .deb ships its own AppArmor profile instead).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: "Windows: ffmpeg (test media for the player and previews)"
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress > /dev/null && ffmpeg -version | head -n1

      - name: Typecheck
        run: npm run typecheck -w @ddv4/desktop

      - name: Agent tests (core on Node, HTTP/2 pool, disk transfers, resume after SIGKILL)
        run: npm test -w @ddv4/desktop

      - name: Build (Electron side + the web app of every mode)
        run: npm run build -w @ddv4/desktop

      - name: Smoke test (start page, built-in instance, window <-> agent, no Node in the page)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npx tsx apps/desktop/test/smoke.ts
          else
            npx tsx apps/desktop/test/smoke.ts
          fi

      - name: End to end in Electron (both first-start choices, disk transfers, copy, player and previews, window closed, restart)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npx tsx apps/desktop/test/e2e.ts
          else
            npx tsx apps/desktop/test/e2e.ts
          fi
