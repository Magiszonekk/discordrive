name: Desktop app builds (main-build)

# Installers of the desktop app from every change on `main` that touches the app: Windows .exe (NSIS), Linux
# AppImage + .deb, SHA256SUMS and build-info.json (the commit; the app compares it with its own to offer an
# update). They replace the assets of ONE pre-release, tag `main-build`. Builds are not code-signed; the app
# never installs an update by itself (see README). On pull requests the installers are built and kept as
# workflow artifacts only, nothing is published.
on:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "apps/cli/**"
      - "apps/web-mo/**"
      - "apps/ddn-server/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/desktop-release.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/cli/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The version counts the commits (below).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: "Version: 0.1.<commits on main> (grows with every build; dpkg, App Center and NSIS compare it)"
        run: echo "DDN_VERSION=0.1.$(git rev-list --count ${{ github.event.pull_request.head.sha || github.sha }})" >> "$GITHUB_ENV"

      - name: Build the app
        env:
          # The commit the app says it is (a pull request runs on a merge commit GitHub made; use its head).
          DDN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build -w @ddv4/desktop

      - name: "Linux: the disk helper (ddn-fuse) packed with the app"
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: cargo build --release --manifest-path apps/desktop/native/fuse/Cargo.toml

      - name: "Windows: the disk helper (ddn-cf) packed with the app"
        if: runner.os == 'Windows'
        timeout-minutes: 12
        shell: bash
        run: |
          cargo build --release --manifest-path apps/desktop/native/cf/Cargo.toml
          cargo build --release --manifest-path apps/desktop/native/cf-thumb/Cargo.toml

      - name: Installers
        run: npx tsx apps/desktop/package.ts ${{ matrix.target }}

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/SHA256SUMS
            apps/desktop/release/build-info.json
          if-no-files-found: error

  # The command line `ddn` (docs/cli.md): one executable per system (Node's single executable applications,
  # node:sqlite inside, no installation), plus the bundle (ddn.cjs + ddn.mjs) for any Node.js 22.13+. Each
  # executable runs the smoke test (a local instance, login, 64 MiB put/get with SHA-256, ddn serve stopped
  # during an upload) before it is kept.
  cli:
    name: ddn (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: windows-latest
            name: windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Version
        run: echo "DDN_VERSION=0.1.$(git rev-list --count ${{ github.event.pull_request.head.sha || github.sha }})" >> "$GITHUB_ENV"

      - name: Build ddn (bundle + single executable)
        env:
          DDN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx tsx apps/cli/build.ts --sea

      - name: Smoke test of the executable
        run: |
          exe=$(ls apps/cli/dist/ddn-*-* | head -1)
          "$exe" version
          DDN_BIN="$exe" npx tsx apps/cli/test/smoke.ts

      - name: Smoke test of the bundle (Linux x64 only)
        if: matrix.name == 'linux-x64'
        run: DDN_BIN=apps/cli/dist/ddn.cjs DDN_SMOKE_MB=16 npx tsx apps/cli/test/smoke.ts

      - name: Keep it
        run: |
          mkdir -p cli-out
          for f in apps/cli/dist/ddn-*-*; do cp "$f" cli-out/; done
          if [ "${{ matrix.name }}" = linux-x64 ]; then
            (cd apps/cli/dist && tar czf ../../../cli-out/ddn-node.tar.gz ddn.cjs ddn.mjs)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: cli-out/*
          if-no-files-found: error

  update-in-place:
    # "Install and restart" on Windows for real: version A installed, the user's shortcuts moved/added,
    # A updates itself to B (silent NSIS in update mode); shortcuts, data and the restart are checked.
    name: update in place (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Version A (the same code, marked as an older build)
        env:
          DDN_COMMIT: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        run: |
          npm run build -w @ddv4/desktop
          npx tsx apps/desktop/package.ts --win
          mv apps/desktop/release "$RUNNER_TEMP/release-a"

      - name: Version B (this commit)
        env:
          DDN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run build -w @ddv4/desktop
          npx tsx apps/desktop/package.ts --win
          mv apps/desktop/release "$RUNNER_TEMP/release-b"

      - name: Install A, move the shortcuts, update to B from the app, check
        run: npx tsx apps/desktop/test/update-in-place.ts "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"

  update-deb:
    # "Install and restart" with the .deb for real: version A installed with dpkg, A updates itself to B (dpkg -i
    # through the elevation program; pkexec needs a desktop session, so CI uses sudo -n), the package version,
    # B's files, the restart and the data are checked.
    name: update in place (.deb, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund && .github/scripts/apt-get.sh install -y -q xvfb

      - name: Version A (the same code, an older version and commit)
        env:
          DDN_COMMIT: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          DDN_VERSION: "0.1.1"
        run: |
          npm run build -w @ddv4/desktop
          npx tsx apps/desktop/package.ts --linux
          mv apps/desktop/release "$RUNNER_TEMP/release-a"

      - name: Version B (this commit, a higher version)
        env:
          DDN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          DDN_VERSION: "0.1.2"
        run: |
          npm run build -w @ddv4/desktop
          npx tsx apps/desktop/package.ts --linux
          mv apps/desktop/release "$RUNNER_TEMP/release-b"

      - name: Install A, update to B from the app, check
        run: npx tsx apps/desktop/test/update-deb.ts "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"

  publish:
    name: publish main-build
    needs: [build, cli]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installers of both systems
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: One SHA256SUMS for all files, notes with the changes since the previous build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum $(ls *.exe *.AppImage *.deb ddn-* | sort -u) > SHA256SUMS
          # build-info.json comes from the build (the same ID the app shows: version + source hash + commit).
          prev=$(gh release view main-build --json targetCommitish -q .targetCommitish 2>/dev/null || true)
          {
            echo "Automatic build of \`main\` (not signed; see the README on Windows SmartScreen). The app checks this release and offers the new version; it never installs anything by itself."
            echo
            echo "Command line \`ddn\` (docs/cli.md, docs/local-api.md): \`ddn-linux-x64\`, \`ddn-linux-arm64\`, \`ddn-windows-x64.exe\` (one file, no installation), \`ddn-node.tar.gz\` (for Node.js 22.13+). Check for a newer one with \`ddn version\`; it never updates itself."
            echo
            echo "commit: $GITHUB_SHA"
            echo "built: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "Changes since the previous build:"
            if [ -n "$prev" ] && git cat-file -e "$prev" 2>/dev/null; then git log --format='- %s' "$prev..$GITHUB_SHA" | head -50; else git log --format='- %s' -10 "$GITHUB_SHA"; fi
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > ../notes.md

      - name: Replace the main-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          # Until the repository variable DESKTOP_PUBLISH is "1", the build is left as a DRAFT release
          # (visible to the maintainers only; apps do not see it) for a check before the first publication.
          PUBLISH: ${{ vars.DESKTOP_PUBLISH }}
        run: |
          gh release delete main-build --yes --cleanup-tag 2>/dev/null || true
          if [ "$PUBLISH" = "1" ]; then state=--prerelease; else state=--draft; fi
          gh release create main-build dist/* $state --target "$GITHUB_SHA" --title "discordrive desktop — build of main (${GITHUB_SHA::7})" --notes-file notes.md
