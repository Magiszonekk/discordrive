name: Cross-platform (Windows, Linux, macOS)

# discordrive-next on every system the instance supports: unit tests of the instance, the sync
# core and the client, a non-interactive `setup --yes --accept-risk` + `doctor`, and the
# background start registered for real (Task Scheduler / systemd --user or XDG / LaunchAgent).
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "apps/ddn-server/**"
      - "apps/web-mo/**"
      - "packages/sync-core/**"
      - "packages/metadata-client/**"
      - "packages/server-discord/**"
      - ".github/workflows/cross-platform.yml"
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # The real background start is registered on these throw-away runners only.
      DDN_CI_REAL_AUTOSTART: "1"
      FORCE_COLOR: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # The whole workspace: typescript, tsx and playwright (types) are root devDependencies.
        # Playwright browsers are not downloaded (the browser checks run elsewhere).
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PRISMA_SKIP_POSTINSTALL_GENERATE: "1"
        run: npm ci --no-audit --no-fund

      - name: Versions
        run: |
          node -v
          npm -v
          node -e "const s=require('node:sqlite'); const db=new s.DatabaseSync(':memory:'); console.log('node:sqlite', db.prepare('select sqlite_version() v').get().v)"

      - name: Typecheck
        run: |
          npm run typecheck -w @ddv4/ddn-server
          npm run typecheck -w @ddv4/sync-core
          npm run typecheck -w @ddv4/metadata-client
          npm run typecheck -w @ddv4/server-discord
          npx tsc -p apps/web-mo/tsconfig.json --noEmit

      - name: Unit tests (sync-core)
        run: npm test -w @ddv4/sync-core

      - name: Unit tests (metadata-client)
        run: npm test -w @ddv4/metadata-client

      - name: Unit tests (server-discord, e2ee server side against the fake Discord)
        run: npm test -w @ddv4/server-discord

      - name: Unit tests (ddn-server, incl. the real background start)
        run: npm test -w @ddv4/ddn-server

      - name: setup --yes without --accept-risk is refused
        run: |
          set +e
          out=$(node apps/ddn-server/bin/discordrive.mjs setup --yes --no-self-test --data-dir "$RUNNER_TEMP/refused" 2>&1)
          code=$?
          echo "$out"
          test $code -eq 1
          echo "$out" | grep -q -- "--accept-risk"
          test ! -e "$RUNNER_TEMP/refused/config.json"

      - name: setup --yes --accept-risk, start, doctor
        run: |
          D="$RUNNER_TEMP/ddn"
          node apps/ddn-server/bin/discordrive.mjs setup --yes --accept-risk --no-autostart --port 3020 --data-dir "$D"
          node apps/ddn-server/bin/discordrive.mjs start --data-dir "$D" > "$RUNNER_TEMP/start.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3020/v1/health && break; sleep 1; done
          echo
          node apps/ddn-server/bin/discordrive.mjs doctor --data-dir "$D"
          # a second start says it is already running
          set +e
          node apps/ddn-server/bin/discordrive.mjs start --data-dir "$D"
          test $? -eq 1
          set -e
          # (not piped into grep -q: grep stops at the first match, curl then fails writing the rest, exit 23)
          curl -fsS http://127.0.0.1:3020/ -o "$RUNNER_TEMP/index.html"
          grep -q "cobalt/tokens.css" "$RUNNER_TEMP/index.html"
          cat "$RUNNER_TEMP/start.log"

      - name: setup --mode e2ee (instance pool on a fake Discord), start, doctor, health
        run: |
          D="$RUNNER_TEMP/ddn-e2ee"
          npx tsx apps/ddn-server/scripts/fake-discord.ts "$RUNNER_TEMP" 2 > "$RUNNER_TEMP/fake.log" 2>&1 &
          for i in $(seq 1 30); do test -s "$RUNNER_TEMP/pool.txt" && break; sleep 1; done
          node apps/ddn-server/bin/discordrive.mjs setup --yes --accept-risk --no-autostart --port 3030 --data-dir "$D" --mode e2ee --webhooks-file "$RUNNER_TEMP/pool.txt" --discord-api-origin "$(cat $RUNNER_TEMP/fake.origin)" --no-self-test
          node apps/ddn-server/bin/discordrive.mjs start --data-dir "$D" > "$RUNNER_TEMP/start-e2ee.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3030/v1/health > "$RUNNER_TEMP/h.json" && break; sleep 1; done
          cat "$RUNNER_TEMP/h.json"; echo
          grep -q '"mode":"e2ee"' "$RUNNER_TEMP/h.json"
          grep -q '"pool":{"channels":2,"alive":2}' "$RUNNER_TEMP/h.json"
          node apps/ddn-server/bin/discordrive.mjs doctor --data-dir "$D" | tee "$RUNNER_TEMP/doctor-e2ee.txt"
          grep -q "Mode: built for e2ee" "$RUNNER_TEMP/doctor-e2ee.txt"
          # the mode is fixed: another one on the same data directory is refused
          set +e
          node apps/ddn-server/bin/discordrive.mjs setup --yes --accept-risk --no-autostart --port 3030 --data-dir "$D" --mode metadata-only --no-self-test
          test $? -eq 1
          set -e
          cat "$RUNNER_TEMP/start-e2ee.log"

      - name: setup --mode plain (pool on the fake Discord), start, health, doctor (ffmpeg found or install hint)
        run: |
          D="$RUNNER_TEMP/ddn-plain"
          node apps/ddn-server/bin/discordrive.mjs setup --yes --accept-risk --no-autostart --port 3032 --data-dir "$D" --mode plain --webhooks-file "$RUNNER_TEMP/pool.txt" --discord-api-origin "$(cat $RUNNER_TEMP/fake.origin)" --no-self-test | tee "$RUNNER_TEMP/setup-plain.txt"
          node apps/ddn-server/bin/discordrive.mjs start --data-dir "$D" > "$RUNNER_TEMP/start-plain.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3032/v1/health > "$RUNNER_TEMP/hp.json" && break; sleep 1; done
          cat "$RUNNER_TEMP/hp.json"; echo
          grep -q '"mode":"plain"' "$RUNNER_TEMP/hp.json"
          grep -q '"rangeStreaming":true' "$RUNNER_TEMP/hp.json"
          node apps/ddn-server/bin/discordrive.mjs doctor --data-dir "$D" | tee "$RUNNER_TEMP/doctor-plain.txt"
          grep -q "Mode: built for plain" "$RUNNER_TEMP/doctor-plain.txt"
          grep -E "ffmpeg \(thumbnails, previews\)" "$RUNNER_TEMP/doctor-plain.txt"
          cat "$RUNNER_TEMP/start-plain.log"

      - name: Same in PowerShell (Windows console, UTF-8 and the ASCII fallback)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $D = Join-Path $env:RUNNER_TEMP "ddn-pwsh"
          node apps/ddn-server/bin/discordrive.mjs setup --yes --accept-risk --no-autostart --port 3021 --data-dir $D --lang pl
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node apps/ddn-server/bin/discordrive.mjs doctor --data-dir $D
          node apps/ddn-server/bin/discordrive.mjs --help
