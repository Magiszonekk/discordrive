name: Android app

# apps/android: JVM tests of the core modules, debug and release builds, and the sync-core compatibility
# test on an emulator (the phone must reach exactly the state Node reaches from the same random logs).
# The release APK is signed with the release key from the repository secrets when they are available
# (pushes to main, pull requests from this repository); it is kept as a workflow artifact only.
on:
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "packages/sync-core/**"
      - "packages/metadata-client/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "packages/sync-core/**"
      - "packages/metadata-client/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # SHA-256 of the release certificate (public). A build signed with anything else fails: an APK signed
  # with another key cannot update an installed app.
  RELEASE_CERT_SHA256: da236a26e937ab9265b38c7ce2f1fb52077ca0f559e2a97462a5a9866809b31a

jobs:
  build:
    name: build and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: The sync core bundled in the app is current
        working-directory: packages/sync-core
        run: |
          npx tsx scripts/android-assets.ts
          git diff --exit-code -- ../../apps/android/syncjs/src/main/assets/sync-core.js \
            || { echo "::error::apps/android/syncjs/src/main/assets/sync-core.js is stale: run npx tsx scripts/android-assets.ts in packages/sync-core and commit it"; exit 1; }

      - name: The account vectors (made by the TypeScript client) are current
        working-directory: packages/metadata-client
        run: |
          npx tsx scripts/android-vectors.ts > /dev/null
          # The IVs and the pairing keys are random: compare everything else.
          node -e '
            const f = "../../apps/android/core/ddn/src/test/resources/account-vectors.json";
            const cur = JSON.parse(require("fs").readFileSync(f, "utf8"));
            const old = JSON.parse(require("child_process").execSync(`git show HEAD:apps/android/core/ddn/src/test/resources/account-vectors.json`, { cwd: "../.." }).toString());
            const fixed = (v) => ({ subkeys: v.subkeyProbe, ed: v.ed25519, op: v.op.decrypted, vault: v.vault.content, names: v.deviceName.cleaned, head: v.snapshots.headSeq, state: v.snapshots.stateSha256AtHead, kit1: v.kits.kit1, kit3: v.kits.kit3 });
            if (JSON.stringify(fixed(cur)) !== JSON.stringify(fixed(old))) { console.error("::error::account-vectors.json is stale: run npx tsx scripts/android-vectors.ts in packages/metadata-client and commit it"); process.exit(1); }
          '
          git checkout -- ../../apps/android/core/ddn/src/test/resources/account-vectors.json
          # The Safe's vectors (random IVs): the header's KDF, the state and the kit must not change.
          npx tsx scripts/safe-vectors.ts > /dev/null
          node -e '
            const f = "../../apps/android/core/ddn/src/test/resources/safe-vectors.json";
            const cur = JSON.parse(require("fs").readFileSync(f, "utf8"));
            const old = JSON.parse(require("child_process").execSync(`git show HEAD:apps/android/core/ddn/src/test/resources/safe-vectors.json`, { cwd: "../.." }).toString());
            const fixed = (v) => ({ a: v.argon2, m: v.masterHex, k: v.header.kdf, s: v.slot.state, r: v.slot.revision, kit: v.kit });
            if (JSON.stringify(fixed(cur)) !== JSON.stringify(fixed(old))) { console.error("::error::safe-vectors.json is stale: run npx tsx scripts/safe-vectors.ts in packages/metadata-client and commit it"); process.exit(1); }
          '
          git checkout -- ../../apps/android/core/ddn/src/test/resources/safe-vectors.json

      - name: JVM tests (account layer against the TypeScript vectors, crypto, API)
        working-directory: apps/android
        run: ./gradlew --no-daemon :core:ddn:test :core:crypto:test :core:api:test

      - name: ffmpeg (test media for the interop scenario)
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 --max-time 180 -o "$RUNNER_TEMP/ff.tar.xz" https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf "$RUNNER_TEMP/ff.tar.xz" -C "$RUNNER_TEMP"
          echo "$(ls -d "$RUNNER_TEMP"/ffmpeg-*-linux64-gpl)/bin" >> "$GITHUB_PATH"

      - name: "Interop: the phone's account layer with a real instance and the TypeScript client (pairing, join from a snapshot, operations)"
        run: npx tsx apps/android/interop/harness.mts
      - name: phone in an e2ee and a plain account (JVM, real instance + fake Discord)
        run: |
          npx tsx apps/android/interop/server-modes.mts --mode e2ee
          npx tsx apps/android/interop/server-modes.mts --mode plain

      - name: Debug build and the instrumentation test APK
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug :syncjs:assembleDebugAndroidTest

      - name: Release build (signed when the release key is available)
        working-directory: apps/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 0.1.0-${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
            chmod 600 "$ANDROID_KEYSTORE_FILE"
          else
            echo "::notice::No release key in this run (e.g. a pull request from a fork): the release APK stays unsigned"
          fi
          ./gradlew --no-daemon :app:assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            apk=app/build/outputs/apk/release/app-release.apk
            apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
            "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
            got=$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')
            [ "$got" = "$RELEASE_CERT_SHA256" ] || { echo "::error::release APK signed with an unexpected certificate ($got)"; exit 1; }
          fi

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/release/app-release*.apk
          retention-days: 14

  publish:
    # The app's update check reads this pre-release: the signed APK of the newest main and android-build.json
    # (versionCode = the run number, so every build of main is higher than the one before).
    name: publish android-main-build
    needs: [build, sync-core-on-emulator]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The APKs of this run
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk

      - name: Replace the android-main-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ github.run_number }}
        run: |
          src=$(find apk -name 'app-release.apk' | head -n1)
          # Only a build signed with the release key is published (an unsigned one cannot update the app).
          [ -n "$src" ] || { echo "::notice::no signed release APK in this run: nothing published"; exit 0; }
          mkdir -p out
          name="discordrive-android-$CODE.apk"
          cp "$src" "out/$name"
          sha=$(sha256sum "out/$name" | awk '{print $1}')
          printf '{"versionCode":%s,"versionName":"0.1.0-%s","commit":"%s","apk":"%s","sha256":"%s"}\n' "$CODE" "$CODE" "$GITHUB_SHA" "$name" "$sha" > out/android-build.json
          (cd out && sha256sum "$name" > SHA256SUMS)
          {
            echo "Automatic build of \`main\` for Android (signed). The app checks this release and offers the new version; the system installer asks before anything is installed."
            echo
            echo "commit: $GITHUB_SHA"
            echo "versionCode: $CODE"
            echo
            echo "SHA-256:"
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } > notes.md
          gh release delete android-main-build --yes --cleanup-tag 2>/dev/null || true
          gh release create android-main-build out/* --prerelease --target "$GITHUB_SHA" --title "discordrive Android — build of main (${GITHUB_SHA::7})" --notes-file notes.md

  sync-core-on-emulator:
    name: sync-core compatibility (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      # Test media for the interop scenario (a photo with its thumbnail, a video): a static build.
      - name: ffmpeg
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 --max-time 180 -o "$RUNNER_TEMP/ff.tar.xz" https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf "$RUNNER_TEMP/ff.tar.xz" -C "$RUNNER_TEMP"
          echo "$(ls -d "$RUNNER_TEMP"/ffmpeg-*-linux64-gpl)/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the test APKs first (outside the emulator's time budget)
        working-directory: apps/android
        # B: the same app with a higher versionCode, served by the harness's fake releases API (the update test).
        run: |
          ANDROID_VERSION_CODE=101 ./gradlew --no-daemon :app:assembleDebug
          mkdir -p build/update-b && cp app/build/outputs/apk/debug/app-debug.apk build/update-b/app-b.apk
          ANDROID_VERSION_CODE=100 ./gradlew --no-daemon :syncjs:assembleDebugAndroidTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Compatibility test and benchmark on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/android
          script: |
            adb logcat -c
            ./gradlew --no-daemon :syncjs:connectedDebugAndroidTest || { adb logcat -d -s ddn-syncjs:* AndroidRuntime:E TestRunner:*; exit 1; }
            adb logcat -d -s ddn-syncjs:* | grep RESULT || true
            # The interop scenario on the emulator, the index in its own JS engine (connected tests uninstall the APK).
            adb install -r -t syncjs/build/outputs/apk/androidTest/debug/syncjs-debug-androidTest.apk
            # (each line runs on its own in working-directory apps/android)
            cd ../.. && npx tsx apps/android/interop/harness.mts --device
            # The app's browsing screens (Files, a folder, the Gallery with a web upload's thumbnail, the viewer).
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            for p in READ_MEDIA_IMAGES READ_MEDIA_VIDEO ACCESS_MEDIA_LOCATION POST_NOTIFICATIONS; do adb shell pm grant io.github.magiszonekk.discordrive android.permission.$p || true; done
            adb logcat -c
            adb shell appops set io.github.magiszonekk.discordrive REQUEST_INSTALL_PACKAGES allow || true
            cd ../.. && npx tsx apps/android/interop/harness.mts --app --updates-apk apps/android/build/update-b/app-b.apk --updates-code 101 || { adb logcat -d -s ddn-ui:* ddn-backup:* ddn:* AndroidRuntime:E WM-WorkerWrapper:*; exit 1; }
            mkdir -p build/shots && adb pull /sdcard/Android/data/io.github.magiszonekk.discordrive/files/shots build/shots || true
            # The join screen after a join with a note (OK enabled, opens the files): am instrument exits 0 on a
            # failure too, its report says OK or FAILURES.
            adb shell am instrument -w -e class com.discordrive.gallery.JoinNoteTest io.github.magiszonekk.discordrive.test/androidx.test.runner.AndroidJUnitRunner | tee build/join-note.txt; grep -q "^OK (3 tests)" build/join-note.txt
            adb shell am instrument -w -e class com.discordrive.gallery.CobaltScreensTest io.github.magiszonekk.discordrive.test/androidx.test.runner.AndroidJUnitRunner | tee build/cobalt-screens.txt; grep -q "^OK (" build/cobalt-screens.txt

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sync-core-report
          path: |
            apps/android/syncjs/build/reports/androidTests/
            apps/android/build/shots/
          retention-days: 14
