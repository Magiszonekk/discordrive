[package]
name = "ddn-fuse"
version = "0.1.0"
edition = "2021"
description = "The desktop app's disk in the system (Linux): a FUSE file system that asks the app's agent over a Unix socket"
license = "MIT"
publish = false

[dependencies]
# No libfuse: fuser speaks the kernel protocol itself and mounts through the system's fusermount3.
fuser = { version = "0.15", default-features = false, features = ["abi-7-19"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Thumbnails for the file manager: the stored previews (WebP / JPEG / PNG) to PNG (freedesktop spec).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
