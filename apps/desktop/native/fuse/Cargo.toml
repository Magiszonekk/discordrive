[package]
name = "ddn-fuse"
version = "0.1.0"
edition = "2021"
description = "The desktop app's disk in the system (Linux): a FUSE file system that asks the app's agent over a Unix socket"
license = "MIT"
publish = false

[dependencies]
# No libfuse: fuser speaks the kernel protocol itself and mounts through the system's fusermount3.
fuser = { version = "0.15", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
