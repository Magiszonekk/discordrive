[package]
name = "ddn-cf-thumb"
version = "0.1.0"
edition = "2021"
publish = false
description = "Explorer thumbnails of the files of the discordrive disk (Windows), from the account's encrypted previews"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde_json = "1"
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
